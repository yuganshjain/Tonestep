name: Tonestep
options:
  bundleIdPrefix: com.yugansh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "GD3K4V2Y8Q"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tonestep uses the microphone for pitch detection in Singing Practice exercises."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

targets:
  Tonestep:
    type: application
    platform: iOS
    sources:
      - path: Tonestep
        excludes:
          - "Resources/Lessons"
      # Folder reference, not a group: LessonLibrary looks the pieces up with
      # Bundle.urls(forResourcesWithExtension:subdirectory:"Lessons"), which
      # only resolves if the directory survives into the bundle.
      - path: Tonestep/Resources/Lessons
        type: folder
    resources:
      - path: Tonestep/Resources/Assets.xcassets
      - path: Tonestep/PrivacyInfo.xcprivacy
    entitlements:
      path: Tonestep/Tonestep.entitlements
    info:
      path: Tonestep/Info.plist
      properties:
        CFBundleDisplayName: Tonestep
        CFBundleName: Tonestep
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - tonestep
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        # Without this key iOS runs the app letterboxed in a 320x480 canvas
        # with black bars top and bottom. Presence of the key is what opts the
        # app into the device's native full-screen size.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.Tonestep
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
      - sdk: SwiftData.framework
      - sdk: AudioToolbox.framework
      - sdk: GameKit.framework
      - sdk: CoreMIDI.framework
      - sdk: WidgetKit.framework
      - target: TonestepWidget

  TonestepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TonestepWidget
    entitlements:
      path: TonestepWidget/TonestepWidget.entitlements
    info:
      path: TonestepWidget/Info.plist
      properties:
        CFBundleDisplayName: Tonestep Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.Tonestep.widget
        SWIFT_VERSION: "5.9"
        DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  TonestepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TonestepTests
    dependencies:
      - target: Tonestep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.TonestepTests
        # Without this the test bundle has no Info.plist and code signing fails,
        # so `xcodebuild test` never runs a single test.
        GENERATE_INFOPLIST_FILE: YES
