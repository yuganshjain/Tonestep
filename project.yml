name: EarIQ
options:
  bundleIdPrefix: com.yugansh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Set DEVELOPMENT_TEAM to your 10-character Apple Developer team ID before archiving
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "EarIQ uses the microphone for pitch detection in Singing Practice exercises."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

targets:
  EarIQ:
    type: application
    platform: iOS
    sources:
      - path: EarIQ
    resources:
      - path: EarIQ/Resources/Assets.xcassets
      - path: EarIQ/PrivacyInfo.xcprivacy
    info:
      path: EarIQ/Info.plist
      properties:
        CFBundleDisplayName: EarIQ
        CFBundleName: EarIQ
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.EarIQ
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
      - sdk: SwiftData.framework
      - sdk: AudioToolbox.framework

  EarIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EarIQTests
    dependencies:
      - target: EarIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.EarIQTests
