name: EarIQ
options:
  bundleIdPrefix: com.yugansh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "EarIQ uses the microphone for rhythm clap-back and pitch detection exercises."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

targets:
  EarIQ:
    type: application
    platform: iOS
    sources:
      - path: EarIQ
    resources:
      - path: EarIQ/Resources
        optional: true
    info:
      path: EarIQ/Info.plist
      properties:
        CFBundleDisplayName: EarIQ
        CFBundleName: EarIQ
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.EarIQ
    dependencies:
      - framework: AVFoundation.framework
      - framework: StoreKit.framework
      - framework: SwiftData.framework
      - framework: AudioToolbox.framework

  EarIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EarIQTests
    dependencies:
      - target: EarIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yugansh.EarIQTests
